@if (!isMenuButton) {
  <button tuiButton
    size="m"
    (click)="remove()"
    [loading]="showLoader"
    [disabled]="isDisabled" class="">
    <span i18n="@@action.delete">Delete</span>
  </button>
}

@if (isMenuButton) {
  <button tuiOption
    size="m"
    (click)="remove()"
    [disabled]="isDisabled" class="tui-space_right-3 tui-space_top-3">
    <span i18n="@@action.delete">Delete</span>
  </button>
}

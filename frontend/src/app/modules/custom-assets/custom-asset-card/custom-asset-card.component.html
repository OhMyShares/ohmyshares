<app-actions>
  <app-back-button appearance="secondary" size="s"></app-back-button>
</app-actions>

@if (customAsset) {
  <div>
    <div class="tui-container tui-container_adaptive">
      <div class="tui-row tui-row_adaptive">
        <div class="tui-col_md-6 tui-col_xs-12">
          <div tuiCardLarge>
            <h1 class="tui-island__title">
              {{ customAsset.name || editForm.value.name || 'New custom asset' }}
            </h1>
            <form [formGroup]="editForm" (keyup.enter)="save()" class="tui-space_bottom-2">
              <div class="tui-form__row">
                <tui-textfield>
                  <input tuiInput
                    placeholder="Asset Ticker"
                    i18n-placeholder="@@form.customAsset.field.ticker"
                    required formControlName="ticker">
                  <label tuiLabel i18n="@@form.customAsset.field.ticker">Name</label>              </tui-textfield>
                  <tui-error formControlName="ticker" ></tui-error>
                </div>
                <div class="tui-form__row">
                  <tui-textfield>
                    <input tuiInput
                      placeholder="Asset Name"
                      i18n-placeholder="@@form.customAsset.field.name"
                      required formControlName="name">
                    <label tuiLabel i18n="@@form.customAsset.field.name">Name</label>              </tui-textfield>
                    <tui-error formControlName="name" ></tui-error>
                  </div>
                  <div class="tui-form__row tui-form__row_multi-fields">
                    <div class="tui-form__multi-field">
                      <tui-textfield
                        [stringify]="referencesService.stringifyCurrencySearch(currencies)">
                        <input tuiComboBox formControlName="currency_code"
                          placeholder="Currency"
                          i18n-placeholder="@@form.portfolio.field.currency_id"
                          required>
                        <label tuiLabel i18n="@@form.portfolio.field.currency_id">Currency</label>
                        <tui-data-list-wrapper
                          *tuiDropdown
                          [itemContent]="currencyItem"
                          [items]="currencyCodes | tuiFilterByInput">
                        </tui-data-list-wrapper>
                      </tui-textfield>
                      <ng-template #currencyItem let-item>
                        {{ referencesService.stringifyCurrencySearch(currencies)(item) }}
                      </ng-template>
                      <tui-error formControlName="currency_code" ></tui-error>
                    </div>
                  </div>
                  <div class="tui-form__row">
                    <tui-textfield>
                      <input tuiInput
                        placeholder="Info"
                        i18n-placeholder="@@form.customAsset.field.info" formControlName="info">
                      <label tuiLabel i18n="@@form.customAsset.field.info">Info</label>              </tui-textfield>
                      <tui-error formControlName="info" ></tui-error>
                    </div>
                  </form>
                  @if (customAsset && editForm) {
                    <app-form-actions (save)="save()" [isSaveShowLoader]="showLoader"
                      (delete)="delete()"
                      i18n-confirmTitle="@@form.customAsset.confirmTitle"
                      confirmTitle="Are you sure you want to delete this custom asset?"
                      [isSaveDisabled]="editForm.invalid"
                      [isDeleteDisabled]="!customAsset.id">
                    </app-form-actions>
                  }
                </div>
              </div>
            </div>
          </div>
        </div>
      }

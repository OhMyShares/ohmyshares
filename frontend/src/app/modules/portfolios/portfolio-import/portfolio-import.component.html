<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-6 tui-col_xs-12">
      <div tuiCardLarge>
        <h1 class="tui-island__title" i18n="@@form.import.title">
                    Trades import
                </h1>

        <form [formGroup]="importForm" class="tui-space_bottom-3">
          @if (!importForm.value.file) {
            <label tuiInputFiles>
              <input tuiInputFiles
                formControlName="file"
                (reject)="onReject($event)">
            </label>
          }

          <tui-files class="tui-space_top-1">
            @if (loadedFiles$ | async; as file) {
              <tui-file
                [file]="file"
                [showDelete]="importForm.controls['file'].enabled"
                (remove)="removeFile()"
              ></tui-file>
            }

            @if (rejectedFiles$ | async; as file) {
              <tui-file
                state="error"
                [file]="file"
                [showDelete]="importForm.controls['file'].enabled"
                (remove)="clearRejected()"
              ></tui-file>
            }

            @if (loadingFiles$ | async; as file) {
              <tui-file
                state="loading"
                [file]="file"
                [showDelete]="importForm.controls['file'].enabled"
              ></tui-file>
            }
          </tui-files>

          <div class="tui-form__row">
            @let items = parsers;
            <tui-textfield tuiChevron

              [stringify]="stringify(items)">
              <input formControlName="parser" tuiSelect
                placeholder="Broker"
                i18n-placeholder="@@form.import.field.broker"
                required>
              <label tuiLabel i18n="@@form.import.field.broker">Broker</label>
              <ng-template tuiDropdown>
                @if (parsers) {
                  <tui-data-list>
                    @for (item of parsers; track item) {
                      <button tuiOption [value]="item.id">
                        {{ item.title }}
                      </button>
                    }
                  </tui-data-list>
                }
              </ng-template>
            </tui-textfield>
            <tui-error formControlName="parser" ></tui-error>
          </div>
        </form>

        <div class="tui-form__buttons">
          <button tuiButton appearance="primary"
            [disabled]="importForm.invalid"
            (click)="submit()">
            <span i18n="@@action.import">Import</span>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

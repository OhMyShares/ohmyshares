<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-12 tui-col_xs-12">

      <h1 class="tui-space_top-0" i18n="@@nav.companies">
        Companies
      </h1>

      <div class="tui-form__row">
        <div class="tui-form__row_half-width">
          <tui-input [formControl]="searchField"
                     [tuiTextfieldCleaner]="true"
                     class="tui-space_bottom-3">
            <input tuiTextfield>
            <span i18n="@@common.search">
              Search...
            </span>
          </tui-input>
        </div>
      </div>

      <tui-scrollbar waIntersectionRoot
                     class="scrollbar"
                     [hidden]="true">
        <table tuiTable class="table" [columns]="displayedColumns" [class.tui-skeleton]="skeletonVisible">
          <thead>
          <tr tuiThGroup>
            <th tuiTh i18n="@@table.companies.column.ticker">Ticker</th>
            <th tuiTh i18n="@@table.companies.column.name">Name</th>
          </tr>
          </thead>
          <tbody tuiTbody [data]="companies">
          <tr tuiTr *tuiRow="let item of companies"
              [routerLink]="item.ticker"
              class="tui-table__tr_cursor_pointer">
            <td *tuiCell="'ticker'" tuiTd>
              {{ item.ticker }}
            </td>
          </tr>
          </tbody>
        </table>
      </tui-scrollbar>
    </div>
  </div>

</div>

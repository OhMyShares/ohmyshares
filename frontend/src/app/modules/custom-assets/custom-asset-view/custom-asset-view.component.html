<app-actions>
  <app-back-button
    appearance="secondary"
    size="s">
  </app-back-button>
  <a tuiButton
     appearance="secondary"
     size="s"
     class="tui-space_bottom-3 tui-space_right-3"
     icon="tuiIconPlus"
     [routerLink]="['price', 'new']">
    <span i18n="@@action.addCustomAssetPrice">Add Price</span>
  </a>
  <a tuiButton
     appearance="secondary"
     size="s"
     class="tui-space_bottom-3 tui-space_right-3"
     icon="tuiIconEdit"
     [routerLink]="['edit']">
    <span i18n="@@action.edit">Edit</span>
  </a>
</app-actions>

<div class="tui-container tui-container_adaptive tui-space_bottom-5">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-12 tui-col_xs-12">

      <tui-island *ngIf="customAsset">
        <h1 class="tui-island__title">
          {{ customAsset.ticker }}
        </h1>
        <div>
          {{ customAsset.currency_sign }} {{ customAsset.price | tuiFormatNumber }}
        </div>
      </tui-island>

    </div>
  </div>
</div>

<div class="tui-container tui-container_adaptive tui-space_bottom-5">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-6 tui-col_xs-12 tui-space_bottom-5">
      <tui-island>
        <h2 class="tui-island__title" i18n="@@form.customAsset.graph">
          Graph
        </h2>
        <tui-axes class="axes" [verticalLines]="10" [horizontalLines]="10">
          <tui-line-chart
            [x]="0"
            [y]="0"
            [width]="chartXMax + chartXMax * 0.25"
            [height]="chartYMax + chartYMax * 0.25"
            [smoothingFactor]="50"
            [filled]="true"
            [value]="chartData"
            [xStringify]="stringify"
            [yStringify]="stringify"
          ></tui-line-chart>
        </tui-axes>
      </tui-island>
    </div>
    <div class="tui-col_md-6 tui-col_xs-12 tui-space_bottom-5">
      <tui-island>
        <h2 class="tui-island__title" i18n="@@form.customAsset.priceHistory">
          Price History
        </h2>
        <app-custom-assets-prices-list [customAssetsPrices]="customAssetsPrices"></app-custom-assets-prices-list>
      </tui-island>
    </div>
  </div>
</div>

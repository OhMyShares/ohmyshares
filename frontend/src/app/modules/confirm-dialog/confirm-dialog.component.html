<p>{{ data?.content }}</p>

<button tuiButton
        (click)="submit()"
        appearance="secondary"
        class="tui-space_bottom-3 tui-space_right-3">

</button>

<button tuiButton
        (click)="close()"
        appearance="primary"
        class="tui-space_bottom-3 tui-space_right-3">
  {{data?.button?.close}}
</button>

<div class="tui-container tui-container_adaptive">
  <tui-tabs>
    @for (item of items; track item) {
      @if (item.visible) {
        <a
          tuiTab
          routerLinkActive="active"
          [iconStart]="item.icon"
          [routerLink]="[item.route()]">
          {{ item.label }}
        </a>
      }
    }
  </tui-tabs>
</div>

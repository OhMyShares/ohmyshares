@if (portfolio) {
  <div>
    <div class="tui-container tui-container_adaptive">
      <div class="tui-row tui-row_adaptive">
        <div class="tui-col_md-6 tui-col_xs-12">
          <div tuiCardLarge>
            <h1 class="tui-island__title">
              {{ portfolio.name || editForm.value.name || 'New portfolio' }}
            </h1>
            <form [formGroup]="editForm" (keyup.enter)="save()" class="tui-space_bottom-2">
              <div class="tui-form__row">
                <tui-textfield>
                  <input tuiInput
                    placeholder="Portfolio Name"
                    i18n-placeholder="@@form.portfolio.field.name"
                    required formControlName="name">
                  <label tuiLabel i18n="@@form.portfolio.field.name">Name</label>              </tui-textfield>
                  <tui-error formControlName="name" ></tui-error>
                </div>
                <div class="tui-form__row tui-form__row_multi-fields">
                  <div class="tui-form__multi-field">
                    <tui-textfield
                      [stringify]="referencesService.stringifyCurrencySearch(currencies)">
                      <input tuiComboBox formControlName="currency_code"
                        placeholder="Currency"
                        i18n-placeholder="@@form.portfolio.field.currency"
                        required>
                      <label tuiLabel i18n="@@form.portfolio.field.currency">Currency</label>
                      <tui-data-list-wrapper
                        *tuiDropdown
                        [itemContent]="currencyItem"
                        [items]="currencyCodes | tuiFilterByInput">
                      </tui-data-list-wrapper>
                    </tui-textfield>
                    <ng-template #currencyItem let-item>
                      {{ referencesService.stringifyCurrencySearch(currencies)(item) }}
                    </ng-template>
                    <tui-error formControlName="currency_code" ></tui-error>
                  </div>
                  <div class="tui-form__multi-field">
                    @let items = accountTypes;
                    <tui-textfield tuiChevron
                      [stringify]="referencesService.stringify(items)">
                      <input formControlName="account_type" tuiSelect
                        placeholder="Account Type"
                        i18n-placeholder="@@form.portfolio.field.accountType"
                        required>
                      <label tuiLabel i18n="@@form.portfolio.field.accountType">Account Type</label>
                      <ng-template tuiDropdown>
                        @if (accountTypes) {
                          <tui-data-list>
                            @for (item of accountTypes; track item) {
                              <button tuiOption [value]="item.id">
                                {{ item.name }}
                              </button>
                            }
                          </tui-data-list>
                        }
                      </ng-template>
                    </tui-textfield>
                    <tui-error formControlName="account_type" ></tui-error>
                  </div>
                </div>
                <div class="tui-form__row tui-form__row_multi-fields">
                  <div class="tui-form__multi-field">
                    <tui-textfield
                      tuiUnfinishedValidator="Finish filling the field">
                      <label tuiLabel i18n="@@form.portfolio.field.openedAt">Opened At</label>
                      <input tuiInputDate formControlName="opened_at" />
                      <tui-calendar *tuiDropdown />
                    </tui-textfield>
                    <tui-error formControlName="opened_at" ></tui-error>
                  </div>
                  <div class="tui-form__multi-field">
                    <tui-textfield >
                      <input tuiInputNumber formControlName="fee_percent"
                        placeholder="Fee, %"
                        i18n-placeholder="@@form.portfolio.field.feePercent"
                        required>
                      <label tuiLabel i18n="@@form.portfolio.field.feePercent">Fee, %</label>
                    </tui-textfield>
                    <tui-error formControlName="fee_percent" ></tui-error>
                  </div>
                </div>
                <div class="tui-form__row">
                  <tui-textfield >
                    <input tuiInputNumber formControlName="goal"
                      placeholder="Goal"
                      i18n-placeholder="@@form.portfolio.field.goal">
                    <label tuiLabel i18n="@@form.portfolio.field.goal">Goal</label>
                  </tui-textfield>
                  <tui-error formControlName="goal" ></tui-error>
                </div>
              </form>
              @if (portfolio && editForm) {
                <app-form-actions (save)="save()" [isSaveShowLoader]="showLoader"
                  (delete)="delete()"
                  i18n-confirmTitle="@@form.portfolio.confirmTitle"
                  confirmTitle="Are you sure you want to delete this portfolio?"
                  [isSaveDisabled]="editForm.invalid"
                  [isDeleteDisabled]="!portfolio.uid">
                </app-form-actions>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  }

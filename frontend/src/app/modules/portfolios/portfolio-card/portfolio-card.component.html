<div *ngIf="portfolio">
  <div class="tui-container tui-container_adaptive">
    <div class="tui-row tui-row_adaptive">
      <div class="tui-col_md-6 tui-col_xs-12">
        <tui-island>
          <h1 class="tui-island__title">
            {{ portfolio.name || editForm.value.name || 'New portfolio' }}
          </h1>
          <form [formGroup]="editForm" (keyup.enter)="save()" class="tui-space_bottom-2">
            <div class="tui-form__row">
              <tui-input formControlName="name">
                <input tuiTextfield
                       placeholder="Portfolio Name"
                       i18n-placeholder="@@form.portfolio.field.name"
                       required>
                <span i18n="@@form.portfolio.field.name">Name</span>
              </tui-input>
              <tui-error formControlName="name" [error]="[] | tuiFieldError | async"></tui-error>
            </div>
            <div class="tui-form__row tui-form__row_multi-fields">
              <div class="tui-form__multi-field">
                <tui-combo-box formControlName="currency_code"
                               [stringify]="referencesService.stringifyCurrencySearch(currencies)">
                  <input tuiTextfield
                         placeholder="Currency"
                         i18n-placeholder="@@form.portfolio.field.currency"
                         required>
                  <span i18n="@@form.portfolio.field.currency">Currency</span>
                  <tui-data-list-wrapper
                    *tuiDataList
                    [itemContent]="currencyItem"
                    [items]="currencyCodes | tuiFilterByInput">
                  </tui-data-list-wrapper>
                </tui-combo-box>
                <ng-template #currencyItem let-item>
                  {{ referencesService.stringifyCurrencySearch(currencies)(item) }}
                </ng-template>
                <tui-error formControlName="currency_code" [error]="[] | tuiFieldError | async"></tui-error>
              </div>
              <div class="tui-form__multi-field">
                <tui-select formControlName="account_type"
                            *tuiLet="accountTypes as items"
                            [valueContent]="referencesService.stringify(items)">
                  <input tuiTextfield
                         placeholder="Account Type"
                         i18n-placeholder="@@form.portfolio.field.accountType"
                         required>
                  <span i18n="@@form.portfolio.field.accountType">Account Type</span>
                  <ng-template tuiDataList>
                    <tui-data-list *ngIf="accountTypes">
                      <button *ngFor="let item of accountTypes" tuiOption [value]="item.id">
                        {{ item.name }}
                      </button>
                    </tui-data-list>
                  </ng-template>
                </tui-select>
                <tui-error formControlName="account_type" [error]="[] | tuiFieldError | async"></tui-error>
              </div>
            </div>
            <div class="tui-form__row tui-form__row_multi-fields">
              <div class="tui-form__multi-field">
                <tui-input-date formControlName="opened_at"
                                tuiUnfinishedValidator="Finish filling the field">
                  <span i18n="@@form.portfolio.field.openedAt">Opened At</span>
                </tui-input-date>
                <tui-error formControlName="opened_at" [error]="[] | tuiFieldError | async"></tui-error>
              </div>
              <div class="tui-form__multi-field">
                <tui-input-number formControlName="fee_percent">
                  <input tuiTextfield
                         placeholder="Fee, %"
                         i18n-placeholder="@@form.portfolio.field.feePercent"
                         required>
                  <span i18n="@@form.portfolio.field.feePercent">Fee, %</span>
                </tui-input-number>
                <tui-error formControlName="fee_percent" [error]="[] | tuiFieldError | async"></tui-error>
              </div>
            </div>
            <div class="tui-form__row">
              <tui-input-number formControlName="goal">
                <input tuiTextfield
                       placeholder="Goal"
                       i18n-placeholder="@@form.portfolio.field.goal">
                <span i18n="@@form.portfolio.field.goal">Goal</span>
              </tui-input-number>
              <tui-error formControlName="goal" [error]="[] | tuiFieldError | async"></tui-error>
            </div>
          </form>
          <app-form-actions (save)="save()" [isSaveShowLoader]="showLoader"
                            (delete)="delete()"
                            i18n-confirmTitle="@@form.portfolio.confirmTitle"
                            confirmTitle="Are you sure you want to delete this portfolio?"
                            *ngIf="portfolio && editForm"
                            [isSaveDisabled]="editForm.invalid"
                            [isDeleteDisabled]="!portfolio.uid">
          </app-form-actions>
        </tui-island>
      </div>
    </div>
  </div>

</div>

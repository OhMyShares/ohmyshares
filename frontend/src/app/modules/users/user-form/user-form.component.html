<app-actions>
  <app-back-button appearance="secondary" size="s"></app-back-button>
</app-actions>

<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-6 tui-col_xs-12">
      <tui-loader [showLoader]="isLoading">
        <tui-island>
          <h1 class="tui-island__title">
            <ng-container *ngIf="user; else newUserTitle">{{ user.name }}</ng-container>
            <ng-template #newUserTitle>
              <span i18n="@@users.create">Create User</span>
            </ng-template>
          </h1>
          <form [formGroup]="editForm" (keyup.enter)="save()" class="tui-space_bottom-2">

            <div class="tui-form__row">
              <tui-input formControlName="name">
                <input tuiTextfield required autocomplete="off">
                <span i18n="@@form.user.field.name">Name</span>
              </tui-input>
              <tui-error formControlName="name" [error]="[] | tuiFieldError | async"></tui-error>
            </div>

            <div class="tui-form__row">
              <tui-input formControlName="email">
                <input tuiTextfield type="email" required autocomplete="off">
                <span i18n="@@form.user.field.email">Email</span>
              </tui-input>
              <tui-error formControlName="email" [error]="[] | tuiFieldError | async"></tui-error>
            </div>

            <div class="tui-form__row">
              <tui-input-password formControlName="password">
                <ng-container *ngIf="user; else newPasswordLabel">
                  <span i18n="@@form.user.field.passwordEdit">New password (leave empty to keep current)</span>
                </ng-container>
                <ng-template #newPasswordLabel>
                  <span i18n="@@form.user.field.passwordCreate">Password (leave empty to generate and email)</span>
                </ng-template>
                <input tuiTextfield autocomplete="new-password">
              </tui-input-password>
              <tui-error formControlName="password" [error]="[] | tuiFieldError | async"></tui-error>
            </div>

            <div class="tui-form__row tui-form__row_multi-fields">
              <div class="tui-form__multi-field">
                <tui-select formControlName="role"
                            [valueContent]="referencesService.stringify(roles)">
                  <span i18n="@@form.user.field.role">Role</span>
                  <input tuiTextfield>
                  <ng-template tuiDataList>
                    <tui-data-list>
                      <button *ngFor="let item of roles" tuiOption [value]="item.id">
                        {{ item.name }}
                      </button>
                    </tui-data-list>
                  </ng-template>
                </tui-select>
                <tui-error formControlName="role" [error]="[] | tuiFieldError | async"></tui-error>
              </div>
              <div class="tui-form__multi-field">
                <tui-select formControlName="locale">
                  <span i18n="@@form.profile.field.language">Language</span>
                  <input tuiTextfield>
                  <tui-data-list-wrapper *tuiDataList [items]="languages"></tui-data-list-wrapper>
                </tui-select>
                <tui-error formControlName="locale" [error]="[] | tuiFieldError | async"></tui-error>
              </div>
            </div>

            <div class="tui-form__row">
              <div class="tui-form__field-checkbox">
                <tui-checkbox-labeled formControlName="is_ignore_funds_sufficiency">
                  <span i18n="@@form.profile.field.ignoreFunds">Ignore funds insufficiency on trades adding</span>
                </tui-checkbox-labeled>
              </div>
            </div>

            <div class="tui-form__row">
              <div class="tui-form__field-checkbox">
                <tui-checkbox-labeled formControlName="is_test">
                  <span i18n="@@form.user.field.isTest">Test user</span>
                </tui-checkbox-labeled>
              </div>
            </div>

          </form>

          <app-form-actions (save)="save()"
                            (delete)="delete()"
                            [isSaveShowLoader]="isSaving"
                            [isSaveDisabled]="editForm.invalid || isSaving || isLoading"
                            [isDeleteShowLoader]="isDeleting"
                            [isDeleteDisabled]="!user || isSelf"
                            i18n-confirmTitle="@@form.user.confirmTitle"
                            confirmTitle="Are you sure you want to delete this user?">
          </app-form-actions>
        </tui-island>
      </tui-loader>
    </div>
  </div>
</div>

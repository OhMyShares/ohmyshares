<span class="badges">
  @if (version) {
    <span tuiBadge size="m" appearance="neutral">{{ version }}</span>
  }
  @if (approved) {
    <span tuiBadge size="m" appearance="positive" [title]="approvedHint">{{ approvedLabel }}</span>
  }
  @if (popular) {
    <span tuiBadge size="m" appearance="warning" [title]="popularHint">{{ popularLabel }}</span>
  }
</span>

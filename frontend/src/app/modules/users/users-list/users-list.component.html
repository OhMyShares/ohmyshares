<app-actions [isFormActions]="true">
  <a tuiButton
     appearance="secondary"
     size="s"
     icon="tuiIconPlus"
     routerLink="/users/create"
     class="tui-space_bottom-3 tui-space_right-3">
    <span i18n="@@users.create">Create User</span>
  </a>
</app-actions>

<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-12 tui-col_xs-12">
      <h1 class="tui-space_top-0" i18n="@@users.title">
        Users
      </h1>
    </div>
  </div>
</div>

<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-12 tui-col_xs-12">
      <tui-loader [showLoader]="isLoading">
        <tui-scrollbar waIntersectionRoot class="scrollbar" [hidden]="true">
          <table tuiTable class="table" [columns]="columns">
            <thead tuiThead>
              <tr tuiThGroup>
                <th tuiTh *tuiHead="'name'" i18n="@@table.users.column.name">Name</th>
                <th tuiTh *tuiHead="'email'" i18n="@@table.users.column.email">Email</th>
                <th tuiTh *tuiHead="'role'" i18n="@@form.user.field.role">Role</th>
                <th tuiTh *tuiHead="'created_at'" i18n="@@table.users.column.created">Created</th>
                <th tuiTh *tuiHead="'actions'" i18n="@@action.actions">Actions</th>
              </tr>
            </thead>
            <tbody *tuiLet="users | tuiTableSort as sortedUsers" tuiTbody [data]="users">
              <tr tuiTr *ngFor="let user of sortedUsers">
                <td tuiTd *tuiCell="'name'">{{user.name}}</td>
                <td tuiTd *tuiCell="'email'">{{user.email}}</td>
                <td tuiTd *tuiCell="'role'">
                  <tui-badge *ngIf="user.role === UserRole.Admin; else userBadge"
                             status="primary"
                             size="s"
                             value="Admin"
                             i18n-value="@@users.role.admin"></tui-badge>
                  <ng-template #userBadge>
                    <tui-badge status="neutral"
                               size="s"
                               value="User"
                               i18n-value="@@users.role.user"></tui-badge>
                  </ng-template>
                  <tui-badge *ngIf="user.is_test"
                             status="warning"
                             size="s"
                             value="Test"
                             i18n-value="@@users.badge.test"
                             class="tui-space_left-1"></tui-badge>
                </td>
                <td tuiTd *tuiCell="'created_at'">{{1000 * user.created_at | date}}</td>
                <td tuiTd *tuiCell="'actions'">
                  <button tuiIconButton
                          icon="tuiIconEdit"
                          appearance=""
                          size="xs"
                          [routerLink]="['/users', user.id, 'edit']">
                  </button>
                  <button tuiIconButton
                          icon="tuiIconEye"
                          appearance=""
                          size="xs"
                          [routerLink]="['/users/view', user.id]"
                          class="tui-space_left-2">
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </tui-scrollbar>
      </tui-loader>
    </div>
  </div>
</div>

<app-actions [isFormActions]="true">
  <a tuiButton
     appearance="secondary"
     size="s"
     class="tui-space_bottom-3 tui-space_right-3"
     icon="tuiIconChevronLeft"
     routerLinkActive="active"
     [routerLink]="['/profile']">
    <span i18n="@@nav.profile">Profile</span>
  </a>
</app-actions>

<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive tui-space_bottom-1">
    <div class="tui-col_md-12 tui-col_xs-12">
      <h1 class="tui-space_top-0" i18n="@@form.changePassword.title">
        Change Password
      </h1>
    </div>
  </div>

  <div class="tui-row tui-row_adaptive tui-space_bottom-1">
    <div class="tui-col_md-6 tui-col_xs-12">
      <form [formGroup]="changePasswordForm" (keyup.enter)="changePassword()" class="tui-space_bottom-5">
        <div class="tui-form__row">
          <tui-input-password formControlName="password">
            <span i18n="@@form.changePassword.field.password">Current password</span>
          </tui-input-password>
          <tui-error formControlName="body" [error]="[] | tuiFieldError | async"></tui-error>
        </div>
        <div class="tui-form__row">
          <tui-input-password formControlName="password_new">
            <span i18n="@@form.changePassword.field.password_new">New password</span>
          </tui-input-password>
          <tui-error formControlName="body" [error]="[] | tuiFieldError | async"></tui-error>
        </div>
      </form>

      <div class="tui-form__buttons">
        <button tuiButton appearance="primary"
                [showLoader]="isLoading"
                [disabled]="changePasswordForm.invalid || isLoading"
                (click)="changePassword()">
          <span i18n="@@action.send">Send</span>
        </button>
      </div>
    </div>
  </div>
</div>

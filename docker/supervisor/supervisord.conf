[supervisord]
logfile = /dev/null
loglevel = info
pidfile = /var/run/supervisord.pid
nodaemon = true

[include]
files = /etc/supervisor/conf.d/*.conf

[program:php-fpm]
  command=php-fpm
  autostart=true
  autorestart=true
  priority=40
  stdout_logfile=/dev/stdout
  stdout_logfile_maxbytes=0
  stderr_logfile=/dev/stderr
  stderr_logfile_maxbytes=0

[program:nginx]
  command=/usr/sbin/nginx -g 'daemon off;'
  autostart=true
  autorestart=true
  priority=50
  stdout_events_enabled=true
  stderr_events_enabled=true
  stdout_logfile=/dev/stdout
  stdout_logfile_maxbytes=0
  stderr_logfile=/dev/stderr
  stderr_logfile_maxbytes=0

[program:oms-scheduler]
  stdout_logfile=/dev/stdout
  stdout_logfile_maxbytes=0
  command=php /var/www/oms/artisan schedule:work
  autostart=true
  autorestart=true
  redirect_stderr=true

[program:oms-worker]
  process_name=%(program_name)s_%(process_num)02d
  #user=oms
  stdout_logfile=/dev/stdout
  command=php /var/www/oms/artisan queue:work --sleep=3 --tries=3
  autostart=true
  autorestart=true
  numprocs=8
  redirect_stderr=true
  stopwaitsecs=3600

<form [formGroup]="data.opener.searchForm" class="tui-space_bottom-2">
  <div class="tui-form__row tui-form__row_multi-fields">
    <div class="tui-form__multi-field">
      @for (assetType of data.opener.assetTypes; track assetType) {
        <label tuiLabel> <input tuiRadio type="radio" formControlName="asset"
          class="tui-space_bottom-2"
          [value]="assetType.id"
          (change)="assetTypeFilterChanged(assetType)"
          >
          {{ assetType.name }}
        </label>
      }
    </div>
    <div class="tui-form__multi-field">
      @for (tradeType of tradeTypesFiltered; track tradeType) {
        <label tuiLabel> <input tuiRadio type="radio" formControlName="type"
          class="tui-space_bottom-2"
          [value]="tradeType.id"
          (change)="tradeTypeFilterChanged(tradeType)"
          >
          {{ tradeType.name }}
        </label>
      }
    </div>
  </div>
</form>

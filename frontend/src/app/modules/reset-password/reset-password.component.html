<div class="tui-container tui-container_adaptive">

  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-6 tui-col_xs-12">

      <h1 class="tui-text_h3" i18n="@@form.passwordReset.title">Password Reset</h1>

      <form [formGroup]="resetPasswordForm" (keyup.enter)="submit()">
        <div class="tui-form__row">
          <tui-textfield>
          <input tuiInput
                   i18n-placeholder="@@form.passwordReset.field.email"
                   placeholder="user@domain.com"
                   type="email"
                   inputmode="email"
                   autocapitalize="off"
                   name="email"
                   required formControlName="email">
            <label tuiLabel>Email</label>
          </tui-textfield>
        </div>
        <div class="tui-form__row">
          <tui-textfield >
            <input tuiInput formControlName="password"
                   #password
                   i18n-placeholder="@@form.passwordReset.field.password"
                   placeholder="New password"
                   type="password"
                   name="password"
                   required>
            <label tuiLabel>Password</label>
            <tui-icon tuiPassword />
          </tui-textfield>
        </div>
        <div class="tui-form__row">
          <tui-textfield >
            <input tuiInput formControlName="password_confirmation"
                   #password_confirmation
                   i18n-placeholder="@@form.passwordReset.field.password_confirmation"
                   placeholder="New password (again)"
                   type="password"
                   name="password"
                   required>
            <label tuiLabel>Password Confirmation</label>
            <tui-icon tuiPassword />
          </tui-textfield>
        </div>
      </form>

      <div class="tui-form__buttons tui-space_bottom-5">
        <button tuiButton type="button" appearance="primary"
           [loading]="isLoading$ | async"
           [disabled]="resetPasswordForm.invalid || (isLoading$ | async)"
           (click)="submit()">
          <span i18n="@@action.login">Reset password</span>
        </button>
      </div>

      <div class="text-center text-sm-left">
        <a routerLink="/login">
          <span i18n="@@action.loginForExisting">Log In</span>
        </a>
      </div>

    </div>
  </div>
</div>

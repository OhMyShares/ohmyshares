<app-actions>
  <app-back-button appearance="secondary" size="s"></app-back-button>
</app-actions>

<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-col_md-6 tui-col_xs-12">
      <tui-loader [loading]="isLoading">
        <div tuiCardLarge>
          <h1 class="tui-island__title">
            @if (user) {
              {{ user.name }}
            } @else {
              <span i18n="@@users.create">Create User</span>
            }
          </h1>
          <form [formGroup]="editForm" (keyup.enter)="save()" class="tui-space_bottom-2">

            <div class="tui-form__row">
              <tui-textfield>
                <input tuiInput required autocomplete="off" formControlName="name">
                <label tuiLabel i18n="@@form.user.field.name">Name</label>              </tui-textfield>
                <tui-error formControlName="name" ></tui-error>
              </div>

              <div class="tui-form__row">
                <tui-textfield>
                  <input tuiInput type="email" required autocomplete="off" formControlName="email">
                  <label tuiLabel i18n="@@form.user.field.email">Email</label>              </tui-textfield>
                  <tui-error formControlName="email" ></tui-error>
                </div>

                <div class="tui-form__row">
                  <tui-textfield >
                    @if (user) {
                      <label tuiLabel i18n="@@form.user.field.passwordEdit">New password (leave empty to keep current)</label>
                    } @else {
                      <label tuiLabel i18n="@@form.user.field.passwordCreate">Password (leave empty to generate and email)</label>
                    }
                    <input tuiInput type="password" formControlName="password" autocomplete="new-password">
                    <tui-icon tuiPassword />

                  </tui-textfield>
                  <tui-error formControlName="password" ></tui-error>
                </div>

                <div class="tui-form__row tui-form__row_multi-fields">
                  <div class="tui-form__multi-field">
                    <tui-textfield tuiChevron
                      [stringify]="referencesService.stringify(roles)">
                      <label tuiLabel i18n="@@form.user.field.role">Role</label>
                      <input formControlName="role" tuiSelect>
                      <ng-template tuiDropdown>
                        <tui-data-list>
                          @for (item of roles; track item) {
                            <button tuiOption [value]="item.id">
                              {{ item.name }}
                            </button>
                          }
                        </tui-data-list>
                      </ng-template>
                    </tui-textfield>
                    <tui-error formControlName="role" ></tui-error>
                  </div>
                  <div class="tui-form__multi-field">
                    <tui-textfield tuiChevron>
                      <label tuiLabel i18n="@@form.profile.field.language">Language</label>
                      <input formControlName="locale" tuiSelect>
                      <tui-data-list-wrapper *tuiDropdown [items]="languages"></tui-data-list-wrapper>
                    </tui-textfield>
                    <tui-error formControlName="locale" ></tui-error>
                  </div>
                </div>

                <div class="tui-form__row">
                  <div class="tui-form__field-checkbox">
                    <label tuiLabel> <input tuiCheckbox type="checkbox" formControlName="is_ignore_funds_sufficiency">
                      <span i18n="@@form.profile.field.ignoreFunds">Ignore funds insufficiency on trades adding</span>
                    </label>
                  </div>
                </div>

                <div class="tui-form__row">
                  <div class="tui-form__field-checkbox">
                    <label tuiLabel> <input tuiCheckbox type="checkbox" formControlName="is_test">
                      <span i18n="@@form.user.field.isTest">Test user</span>
                    </label>
                  </div>
                </div>

              </form>

              <app-form-actions (save)="save()"
                (delete)="delete()"
                [isSaveShowLoader]="isSaving"
                [isSaveDisabled]="editForm.invalid || isSaving || isLoading"
                [isDeleteShowLoader]="isDeleting"
                [isDeleteDisabled]="!user || isSelf"
                i18n-confirmTitle="@@form.user.confirmTitle"
                confirmTitle="Are you sure you want to delete this user?">
              </app-form-actions>
            </div>
          </tui-loader>
        </div>
      </div>
    </div>
